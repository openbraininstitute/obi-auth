# Coverage config for the Python 3.11 tox env: omits the widget module, which
# needs ipyauth-pkce (Python >= 3.12) and so cannot run on 3.11. 100% is still
# enforced on 3.12+ via the default config in pyproject.toml.
[run]
branch = true
parallel = false
omit =
    */obi_auth/widget.py

[paths]
source =
    src
    */site-packages

[report]
show_missing = true
precision = 0
fail_under = 100
